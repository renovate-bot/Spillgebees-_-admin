name: "\U0001f6e1\ufe0f Safe Settings Sync"

on:
  push:
    branches: [main]
    paths:
      - ".github/settings.yml"
      - ".github/repos/**"
      - ".github/suborgs/**"
      - ".github/workflows/safe-settings-sync.yml"
      - "deployment-settings.yml"
  schedule:
    # Drift check every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: safe-settings-sync
  cancel-in-progress: true

jobs:
  safe-settings-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The private key lives in this environment, which only `main` may use, so
    # workflow runs from other branches can't read it. `deployment: false`
    # keeps the 6-hourly runs out of the deployments list.
    environment:
      name: safe-settings
      deployment: false
    permissions:
      contents: read
    env:
      # Held at 2.1.17 because 2.1.18 renames repos (github/safe-settings#901)
      # and 2.1.19 to 2.1.21 crash in full-sync (github/safe-settings#955).
      # Pinned by SHA since upstream re-creates release tags and this code runs
      # with the org app's private key.
      SAFE_SETTINGS_REF: ff7a65655d33006b9820479df0a9e1057a8927e4 # 2.1.17
      SAFE_SETTINGS_CODE_DIR: ${{ github.workspace }}/.safe-settings-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: github/safe-settings
          ref: ${{ env.SAFE_SETTINGS_REF }}
          path: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 2.1.17 breaks on Node 25+, a jwa dependency uses the removed SlowBuffer
          node-version: 24

      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}

      - run: npm run full-sync
        working-directory: ${{ env.SAFE_SETTINGS_CODE_DIR }}
        env:
          GH_ORG: ${{ vars.SAFE_SETTINGS_GH_ORG }}
          APP_ID: ${{ vars.SAFE_SETTINGS_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SAFE_SETTINGS_PRIVATE_KEY }}
          ADMIN_REPO: admin
          DEPLOYMENT_CONFIG_FILE: ${{ github.workspace }}/deployment-settings.yml
